name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the shader before packaging
        run: |
          bash tools/build_fxc.sh build
          bash tools/check_shader.sh build

      - name: Package
        run: |
          mkdir -p dist/NeuralLook/reshade-shaders/Shaders
          cp Shaders/NeuralLook.fx dist/NeuralLook/reshade-shaders/Shaders/
          cp README.md LICENSE dist/NeuralLook/
          cd dist && zip -r "NeuralLook-${GITHUB_REF_NAME}.zip" NeuralLook

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/NeuralLook-*.zip
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
