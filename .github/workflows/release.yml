name: Release

# Publish a release on GitHub (Releases -> Draft a new release) and this workflow
# checks the shader and attaches the install zip to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the shader before packaging
        run: |
          bash tools/build_fxc.sh build
          bash tools/check_shader.sh build

      - name: Package
        run: |
          mkdir -p dist/NeuralLook/reshade-shaders/Shaders
          cp Shaders/NeuralLook.fx dist/NeuralLook/reshade-shaders/Shaders/
          cp README.md LICENSE dist/NeuralLook/
          cd dist && zip -r "NeuralLook-${GITHUB_REF_NAME}.zip" NeuralLook

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NeuralLook-*.zip
